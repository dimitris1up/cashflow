<style>
:root{
  color-scheme: light;
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f7f8fa; --line:#e3e6eb;
  --text:#14171c; --text-2:#525861; --muted:#8a9099;

  --s-eur:#2a78d6; --s-chf:#eb6834;

  --input:#ffffff; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){

    color-scheme: dark;
    --bg:#111214; --surface:#1a1b1e; --surface-2:#212226; --line:#2e3036;
    --text:#f2f3f5; --text-2:#b9bdc6; --muted:#7d828c;
    --accent:#8fb4e8; --accent-2:#3987e5;
    --s-eur:#3987e5; --s-chf:#d95926;
    --good:#3fbf3f; --bad:#ef6b6b; --warn:#e3a13a;
    --good-bg:#15301a; --bad-bg:#3a1a1a;

  }
}

  color-scheme: dark;
  --bg:#111214; --surface:#1a1b1e; --surface-2:#212226; --line:#2e3036;

}

<body>
<header>
  <h1>Cashflow</h1>
  <nav class="tabs" id="toptabs"></nav>
  <div class="spacer"></div>
  <span class="pill loc" id="syncpill" title="Sync status – click to sync now">local</span>
</header>
<main id="view"></main>
<button class="fab" id="fab" aria-label="Add transaction">+</button>
<nav class="bottomnav" id="bottomnav"></nav>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =====================================================================
   CASHFLOW – single-file app. Data: one list of transactions.
   Everything else (month tables, yearly, balances) is computed.
   Storage: this browser (always, works offline) + your own Google Sheet
   through a small Google Apps Script web app (sync across devices).
   Sync = one request: send what changed here, receive what changed there.
   ===================================================================== */
const APP='cashflow', VER=1;
const LS_DATA='cf_data_v1', LS_SYNC='cf_gsync_v1', LS_UI='cf_ui_v1', LS_RATE='cf_rate_v1';
const FX='__fx';
const BOOKS=['EUR','CHF'];
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TODAY=new Date();
const THIS_YEAR=TODAY.getFullYear(), THIS_MONTH=TODAY.getMonth()+1;
const nowS=()=>Math.floor(Date.now()/1000);
const b36=n=>n.toString(36), unb36=s=>parseInt(s,36);
const rid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const ymKey=(y,m)=>`${y}-${pad(m)}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const NF2=new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const NF0=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const f2=n=>NF2.format(r2(n)), f0=n=>NF0.format(Math.round(+n||0));
const fz=n=>Math.abs(n)<0.005?'<span class="muted">–</span>':f0(n);
function parseAmt(s){
  if(typeof s==='number')return s;
  s=String(s||'').replace(/[^\d,.\-]/g,'');
  if(!s)return NaN;
  const lc=s.lastIndexOf(','), ld=s.lastIndexOf('.');
  if(lc>-1&&ld>-1){ if(lc>ld) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,''); }
  else if(lc>-1){ const dec=s.length-lc-1; s=(dec<=2)?s.replace(',','.'):s.replace(/,/g,''); }
  return parseFloat(s);
}

/* ---------------- default config ---------------- */
const DEFAULT_CATS=[
 {k:'INCOME',l:'Income',kind:'in',types:['Wages & Tips','Interest Income','Dividends','Gifts Received','Refunds_Reimbursements','Transfer from Savings','Other Income']},
 {k:'HOME_EXPENSES',l:'Home Expenses',kind:'out',types:['Mortgage_Rent','Home_Rental Insurance','Electricity','Gas_Oil','Water_Sewer_Trash','Phone','Cable_Satellite','Internet','Furnishings_Appliances','Lawn_Garden','Maintenance_Supplies','Improvements']},
 {k:'TRANSPORTATION',l:'Transportation',kind:'out',types:['Vehicle Payments','Auto Insurance','Fuel','Bus_Taxi_Train Fare','Repairs','Registration_License']},
 {k:'HEALTH',l:'Health',kind:'out',types:['Health Insurance','Doctor_Dentist','Medicine_Drugs','Health Club Dues','Life Insurance','Veterinarian_Pet Care']},
 {k:'DAILY_LIVING',l:'Daily Living',kind:'out',types:['Groceries','Personal Supplies','Clothing','Cleaning','Education_Lessons','Dining_Eating Out','Salon_Barber','Pet Food']},
 {k:'ENTERTAINMENT',l:'Entertainment',kind:'out',types:['Activities','Books','Games','Fun Stuff','Hobbies','Media','Outdoor Recreation','Sports','Toys_Gadgets','Vacation_Travel']},
 {k:'SAVINGS',l:'Savings',kind:'save',types:['Joint Revolut Acc','Crypto','Bank Emergency Acc','Freedom24','Education Fund']},
 {k:'OBLIGATIONS',l:'Obligations',kind:'out',types:['Student Loans','Credit Cards','Other Loans','Federal Taxes','State_Local Taxes']},
 {k:'SUBSCRIPTIONS',l:'Subscriptions',kind:'out',types:['Applications','Memberships']},
 {k:'GIFTS',l:'Gifts',kind:'out',types:['Gifts Given']},
 {k:'MISCELLANEOUS',l:'Miscellaneous',kind:'out',types:['Bank Fees','Postage']},
 {k:'OTHER',l:'Other',kind:'out',types:['Other']}
];
function emptyData(){
  return {
    sec:{ // each section: {u: updated (s), v: value} – merged last-write-wins per section
      cats:{u:0,v:DEFAULT_CATS}, budgets:{u:0,v:{EUR:{},CHF:{}}}, netSav:{u:0,v:{EUR:{},CHF:{}}},
      start:{u:0,v:{EUR:{},CHF:{}}}, pull:{u:0,v:'Transfer from Savings'}, aliases:{u:0,v:{}}
    },
    tx:{},             // year -> {id: tx}
    dirty:{sec:{}, tx:{}},   // what changed here and is not yet in the Sheet (tx: id -> year)
    lastSync:0         // server time of the last successful sync
  };
}
/* tx in memory: {id,y,md,ds,t,a,cy,a2,cy2,u,del}  – stored as arrays:
   [id,md,ds,t,a,cy,u36]  or FX: [id,md,ds,'__fx',aOut,cyOut,u36,aIn,cyIn]  or tombstone [id,u36] */
function txToArr(t){
  if(t.del) return [t.id,b36(t.u)];
  const a=[t.id,t.md,t.ds||'',t.t,r2(t.a),t.cy,b36(t.u)];
  if(t.t===FX){a.push(r2(t.a2),t.cy2);}
  return a;
}
function arrToTx(a,y){
  if(a.length===2) return {id:a[0],y:+y,u:unb36(a[1]),del:1};
  const t={id:a[0],y:+y,md:a[1],ds:a[2],t:a[3],a:+a[4],cy:a[5],u:unb36(a[6])};
  if(t.t===FX){t.a2=+a[7];t.cy2=a[8];}
  return t;
}

/* ---------------- state ---------------- */
let D=loadData();
let SY=Object.assign({url:'',token:'',sheetUrl:'',count:0,at:0},JSON.parse(localStorage.getItem(LS_SYNC)||'{}'));
let UI=Object.assign({tab:'home',book:'EUR',year:THIS_YEAR,month:THIS_MONTH,disp:'EUR',lf:{m:'',b:'',c:'',q:''},lastCy:'EUR',rateManual:''},JSON.parse(localStorage.getItem(LS_UI)||'{}'));
let RATE=JSON.parse(localStorage.getItem(LS_RATE)||'null'); // {r: CHF per 1 EUR, date, fetched}
let syncState='loc', syncTimer=null, syncing=false;

function loadData(){
  try{
    const raw=JSON.parse(localStorage.getItem(LS_DATA)||'null');
    if(!raw) return emptyData();
    const d=emptyData();
    Object.assign(d.sec,raw.sec||{}); d.lastSync=raw.lastSync||0;
    if(raw.dirty&&raw.dirty.tx&&raw.dirty.sec) d.dirty=raw.dirty;
    for(const y in (raw.tx||{})){ d.tx[y]={}; for(const a of raw.tx[y]){const t=arrToTx(a,y); d.tx[y][t.id]=t;} }
    return d;
  }catch(e){console.error(e);return emptyData();}
}
function saveLocal(){
  const out={sec:D.sec,dirty:D.dirty,lastSync:D.lastSync,tx:{}};
  for(const y in D.tx) out.tx[y]=Object.values(D.tx[y]).map(txToArr);
  try{localStorage.setItem(LS_DATA,JSON.stringify(out));}catch(e){toast('Local storage full!');}
}
const saveUI=()=>localStorage.setItem(LS_UI,JSON.stringify(UI));
const cfg=k=>D.sec[k].v;
function setSec(k,v){D.sec[k]={u:nowS(),v};D.dirty.sec[k]=1;saveLocal();scheduleSync();}
function markTx(id,y){D.dirty.tx[id]=+y;}
const isDirty=()=>Object.keys(D.dirty.tx).length+Object.keys(D.dirty.sec).length>0;

/* ---------------- category helpers ---------------- */
function typeMap(){ const m={}; for(const c of cfg('cats')) for(const t of c.types) m[t]=c; return m; }
function resolveType(t){ const al=cfg('aliases'); let n=0; while(al[t]&&n++<20) t=al[t]; return t; }
function catsIncomeFirst(){ const c=cfg('cats'); return [...c.filter(x=>x.kind==='in'),...c.filter(x=>x.kind!=='in')]; }
function liveTx(y){ return Object.values(D.tx[y]||{}).filter(t=>!t.del); }
function allYears(){ const s=new Set([THIS_YEAR,...Object.keys(D.tx).filter(y=>liveTx(y).length).map(Number)]); return [...s].sort(); }

/* ---------------- aggregation ---------------- */
function agg(y,book){
  const TM=typeMap(), pull=cfg('pull');
  const M=[...Array(13)].map(()=>({inc:0,exp:0,sav:0,pull:0,exIn:0,exOut:0,types:{}}));
  for(const t0 of liveTx(y)){
    const m=+t0.md.slice(0,2); const o=M[m];
    if(t0.t===FX){ if(t0.cy===book) o.exOut+=t0.a; if(t0.cy2===book) o.exIn+=t0.a2; continue; }
    if(t0.cy!==book) continue;
    const t=resolveType(t0.t), c=TM[t];
    o.types[t]=(o.types[t]||0)+t0.a;
    if(c&&c.kind==='in'){ o.inc+=t0.a; if(t===pull) o.pull+=t0.a; }
    else { o.exp+=t0.a; if(c&&c.kind==='save') o.sav+=t0.a; }
  }
  const start=+((cfg('start')[book]||{})[y]||0);
  let bal=start;
  const cur=y===THIS_YEAR?THIS_MONTH:(y>THIS_YEAR?1:0); // no projection for past years
  const bud=(cfg('budgets')[book]||{});
  let projAdd=0;
  for(let m=1;m<=12;m++){
    const o=M[m];
    o.net=o.inc-o.exp+o.exIn-o.exOut;
    bal+=o.net; o.end=bal;
    o.realInc=o.inc-o.pull; o.realSp=o.exp-o.sav;
    // budgets
    const b=bud[ymKey(y,m)]||{}; let bi=0,be=0,unspent=0,over=0,remInc=0;
    for(const t in b){ const c=TM[t]; const act=o.types[t]||0; const bv=+b[t]||0;
      if(c&&c.kind==='in'){ bi+=bv; remInc+=Math.max(0,bv-act); }
      else { be+=bv; const d=bv-act; if(d>0) unspent+=d; } }
    for(const t in o.types){ const c=TM[t]; if(c&&c.kind==='in') continue; const d=(+b[t]||0)-o.types[t]; if(d<0) over+=-d; }
    o.budInc=bi; o.budExp=be; o.unspent=unspent; o.over=over;
    if(m>=cur&&cur>0){ projAdd+=remInc-unspent; o.proj=o.end+projAdd; } else o.proj=null;
  }
  // net savings: manual, carried forward
  const ns=(cfg('netSav')[book]||{}); let last=0;
  const prevY=Object.keys(ns).filter(k=>k<ymKey(y,1)).sort().pop(); if(prevY) last=+ns[prevY]||0;
  for(let m=1;m<=12;m++){ const k=ymKey(y,m); if(ns[k]!==undefined&&ns[k]!==''){last=+ns[k];M[m].nsSet=true;} M[m].ns=last; M[m].total=M[m].end+last; }
  return {M,start,cur};
}

function rate(){ const man=parseAmt(UI.rateManual); if(man>0) return man; return RATE&&RATE.r>0?RATE.r:null; }
async function fetchRate(force){

  const urls=['https://api.frankfurter.app/latest?from=EUR&to=CHF','https://api.frankfurter.dev/v1/latest?base=EUR&symbols=CHF'];

  }

function conv(v,from,to){ if(from===to) return v; const r=rate(); if(!r) return NaN; return from==='EUR'? v*r : v/r; }

/* ---------------- Google Sheet sync (Apps Script web app) ---------------- */
const cloudOn=()=>!!(SY.url&&SY.token);
async function api(body){
  const r=await fetch(SY.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({token:SY.token},body))});
  if(!r.ok) throw new Error('HTTP '+r.status);
  let j; try{ j=await r.json(); }catch(e){ throw new Error('The link did not answer like the Cashflow script (check the link / deployment access = Anyone)'); }
  if(j.error) throw new Error(j.error);
  return j;
}
function toRow(t,TM){ // app entry -> Sheet row
  if(t.del) return {id:t.id,u:t.u,del:1};
  const tt=resolveType(t.t), c=TM[tt];
  const r={id:t.id,d:`${t.y}-${t.md}`,ds:t.ds||'',c:t.t===FX?'Exchange':(c?c.l:''),t:t.t===FX?'EXCHANGE':t.t,a:r2(t.a),cy:t.cy,u:t.u};
  if(t.t===FX){r.a2=r2(t.a2);r.cy2=t.cy2;}
  return r;
}
function findAny(id){ for(const y in D.tx) if(D.tx[y][id]) return D.tx[y][id]; return null; }
function placeTx(t){ for(const y in D.tx) if(+y!==t.y&&D.tx[y][t.id]) delete D.tx[y][t.id]; (D.tx[t.y]=D.tx[t.y]||{})[t.id]=t; }
function applyRow(r){ // Sheet row -> app entry (last edit wins)
  const l=findAny(r.id);
  if(l&&l.u>r.u) return;                       // ours is newer: it is (or will be) pushed
  if(l&&l.u===r.u&&D.dirty.tx[r.id]) return;   // our own pending version
  if(r.del){ if(l) { const y=l.y; D.tx[y][r.id]={id:r.id,y,u:r.u,del:1}; } delete D.dirty.tx[r.id]; return; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(r.d)) return;  // unusable date typed in the Sheet
  const t={id:r.id,y:+r.d.slice(0,4),md:r.d.slice(5),ds:r.ds,t:r.t==='EXCHANGE'?FX:r.t,a:+r.a,cy:r.cy,u:r.u};
  if(t.t===FX){t.a2=+r.a2;t.cy2=r.cy2;}
  placeTx(t); delete D.dirty.tx[r.id];
}
function setPill(state,txt){ syncState=state; const p=document.getElementById('syncpill'); p.className='pill '+state; p.textContent=txt; }
function refreshPill(){
  if(!cloudOn()) return setPill('loc','local only');
  if(syncing) return setPill('pend','syncing…');
  if(syncState==='err') return;
  setPill(isDirty()?'pend':'ok',isDirty()?'unsynced':'synced');
}
function scheduleSync(delay){
  refreshPill();
  if(!cloudOn()) return;
  clearTimeout(syncTimer); syncTimer=setTimeout(()=>syncNow(), delay??4000);
}
/* one request: push everything dirty + pull everything changed since last sync */
async function syncNow(opts={}){
  if(!cloudOn()) return;
  if(syncing){ syncAgain=true; return; }
  syncing=true; syncAgain=false; refreshPill(); clearTimeout(syncTimer);
  try{
    const TM=typeMap(), txOut=[], secOut={};
    for(const id in D.dirty.tx){ const t=findAny(id); if(t) txOut.push(toRow(t,TM)); else delete D.dirty.tx[id]; }
    for(const k in D.dirty.sec) if(D.sec[k]) secOut[k]=D.sec[k];
    const res=await api({action:'sync',since:D.lastSync||0,tx:txOut,sec:secOut});
    // what we sent is stored unless we changed it again meanwhile
    for(const r of txOut){ const t=findAny(r.id); if(t&&t.u===r.u) delete D.dirty.tx[r.id]; }
    for(const k in secOut) if(D.sec[k]&&D.sec[k].u===secOut[k].u) delete D.dirty.sec[k];
    for(const r of res.rows||[]) applyRow(r);
    for(const k in res.sec||{}){ const r=res.sec[k], l=D.sec[k]; if(!l||r.u>l.u||(r.u===l.u&&!D.dirty.sec[k])){ D.sec[k]=r; delete D.dirty.sec[k]; } }
    D.lastSync=res.t; SY.sheetUrl=res.url||SY.sheetUrl; SY.count=res.count||0; SY.at=Date.now(); saveSync();
    saveLocal(); syncing=false; syncState='ok'; syncErr=''; refreshPill();
    if((res.rows||[]).length||Object.keys(res.sec||{}).length||opts.render) render();
    if(syncAgain||isDirty()) scheduleSync(1500);
  }catch(e){
    console.error(e); syncing=false; saveLocal();
    setPill('err',navigator.onLine?'sync error':'offline'); syncErr=e.message;
    if(opts.manual) toast('Sync failed: '+e.message);
  }
}
let syncErr='', syncAgain=false;
document.addEventListener('visibilitychange',()=>{
  if(!cloudOn()) return;
  if(document.visibilityState==='hidden'&&isDirty()) syncNow();
  if(document.visibilityState==='visible'&&Date.now()-(SY.at||0)>30000) syncNow();   // back on this device: fetch what the other one did
});

function edDesc(v){ // known description -> preselect its last type & currency
  if(ED.type||ED.kind==='fx') return; const hit=descIndex().get(v.trim()); if(!hit) return;
  const c=typeMap()[hit.t]; if(!c) return; ED.kind=c.kind; ED.cat=c.k; ED.type=hit.t; drawEditor();
}
function fxInfo(){
  const el=document.getElementById('fxinfo'); if(!el) return;
  const a=parseAmt(ED.a), b=parseAmt(ED.a2); if(!(a>0&&b>0)){el.textContent='';return;}
  const got=ED.cy==='EUR'?b/a:a/b; const ref=rate();
  el.innerHTML=`Rate you got: 1 EUR = <b>${got.toFixed(4)}</b> CHF`+(ref?` · reference ${ref.toFixed(4)} (${((got/ref-1)*100*(ED.cy==='EUR'?1:-1)).toFixed(2)}% vs reference)`:'');
}
function edSave(again){
  const e=ED; const a=parseAmt(e.a);
  if(!isFinite(a)||a===0) return toast('Enter an amount');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(e.date)) return toast('Pick a date');
  if(e.kind==='fx'){
    const a2=parseAmt(e.a2); if(!(a2>0)) return toast('Enter the amount received');
    upsertTx({id:e.id,date:e.date,ds:e.ds,t:FX,a,cy:e.cy,a2,cy2:e.cy2});
  } else {
    if(!e.type) return toast('Pick a type');
    upsertTx({id:e.id,date:e.date,ds:e.ds,t:e.type,a,cy:e.cy});
  }
  UI.lastCy=e.cy; saveUI(); toast('Saved');
  if(again){ ED={...ED,id:null,a:'',a2:'',ds:''}; drawEditor(); document.getElementById('e_a').focus(); }
  else closeSheet();
  render();
}
function edDelete(){ const t=findTx(ED.id); if(!t) return; if(!confirm('Delete this entry?')) return; deleteTx(t.y,t.id); closeSheet(); toast('Deleted'); render(); }

/* ---------------- LEDGER ---------------- */
function vLedger(v){
  const F=UI.lf, TM=typeMap(), y=UI.year;
  const yrs=allYears();
  const q=(F.q||'').toLowerCase();
  const list=allTxSorted(t=>{
    if(t.y!==y) return false;
    if(F.m&&+t.md.slice(0,2)!==+F.m) return false;
    if(F.b&&!(t.cy===F.b||t.cy2===F.b)) return false;
    const tt=resolveType(t.t), c=TM[tt];
    if(F.c){ if(F.c==='FX'){ if(t.t!==FX) return false; } else if(!c||c.k!==F.c) return false; }
    if(q&&!((t.ds||'').toLowerCase().includes(q)||tt.toLowerCase().includes(q))) return false;
    return true;
  });
  let h=`<div class="row" style="margin-bottom:12px">
    <select onchange="UI.year=+this.value;saveUI();loadYear(+this.value);render()">${yrs.map(yy=>`<option ${yy===y?'selected':''}>${yy}</option>`).join('')}</select>
    <select onchange="UI.lf.m=this.value;saveUI();render()"><option value="">All months</option>${MN.map((n,i)=>`<option value="${i+1}" ${+F.m===i+1?'selected':''}>${n}</option>`).join('')}</select>
    <select onchange="UI.lf.b=this.value;saveUI();render()"><option value="">EUR + CHF</option>${BOOKS.map(b=>`<option ${F.b===b?'selected':''}>${b}</option>`).join('')}</select>
    <select onchange="UI.lf.c=this.value;saveUI();render()"><option value="">All categories</option>${cfg('cats').map(c=>`<option value="${c.k}" ${F.c===c.k?'selected':''}>${esc(c.l)}</option>`).join('')}<option value="FX" ${F.c==='FX'?'selected':''}>Exchanges</option></select>
    <input type="search" placeholder="Search" value="${esc(F.q||'')}" oninput="UI.lf.q=this.value;saveUI();clearTimeout(window._qt);window._qt=setTimeout(render,250)" style="flex:1;min-width:140px">
  </div>`;
  // totals of filtered
  const sums={}; for(const b of BOOKS) sums[b]={in:0,out:0};
  for(const t of list){ if(t.t===FX) continue; const c=TM[resolveType(t.t)]; if(c&&c.kind==='in') sums[t.cy].in+=t.a; else sums[t.cy].out+=t.a; }
  h+=`<div class="row hint" style="margin-bottom:8px">${list.length} entries · ${BOOKS.filter(b=>sums[b].in||sums[b].out).map(b=>`${b}: <span class="good">+${f2(sums[b].in)}</span> / −${f2(sums[b].out)}`).join(' · ')||''}</div>`;
  if(!list.length){ v.innerHTML=h+'<div class="card empty">Nothing matches</div>'; return; }
  let cur='', body='';
  const shown=list.slice(0,600);
  for(const t of shown){
    const key=t.md; if(key!==cur){ cur=key; body+=`<div class="dayhdr"><span>${pad(+t.md.slice(3))} ${MN[+t.md.slice(0,2)-1]} ${t.y}</span></div>`; }
    body+=txRow(t);
  }
  if(list.length>shown.length) body+=`<div class="hint" style="padding:10px">Showing first ${shown.length} – narrow the filter to see more.</div>`;
  v.innerHTML=h+`<div class="card" style="padding:4px 12px">${body}</div>`;
}

/* ---------------- MONTH ---------------- */
function bookSeg(){ return `<div class="seg">${BOOKS.map(b=>`<button class="${UI.book===b?'on':''}" onclick="UI.book='${b}';saveUI();render()">${b}</button>`).join('')}</div>`; }
function vMonth(v){
  const y=UI.year, m=UI.month, b=UI.book; const A=agg(y,b), o=A.M[m];
  const bud=(cfg('budgets')[b]||{})[ymKey(y,m)]||{};
  const cats=catsIncomeFirst();
  let h=`<div class="row" style="margin-bottom:12px">${bookSeg()}
    <button class="btn sm" onclick="stepMonth(-1)" aria-label="Previous month">‹</button>
    <b style="min-width:90px;text-align:center">${MN[m-1]} ${y}</b>
    <button class="btn sm" onclick="stepMonth(1)" aria-label="Next month">›</button>
    <div style="flex:1"></div>
    <button class="btn sm" onclick="copyBudgets(-1)">Copy budgets from previous month</button>
    <button class="btn sm" onclick="copyBudgets(99)">Copy to rest of year</button></div>`;
  h+=`<div class="grid g4">
    <div class="card kpi"><div class="lbl">Income</div><div class="val num">${f2(o.inc)}</div><div class="sub">budget ${f2(o.budInc)}</div></div>
    <div class="card kpi"><div class="lbl">Expenses (incl. savings)</div><div class="val num">${f2(o.exp)}</div><div class="sub">budget ${f2(o.budExp)} · savings ${f2(o.sav)}</div></div>
    <div class="card kpi"><div class="lbl">Net</div><div class="val num ${o.net<0?'bad':''}">${f2(o.net)}</div><div class="sub">${(o.exIn||o.exOut)?`incl. exchanges +${f0(o.exIn)} / −${f0(o.exOut)}`:'income − expenses'}</div></div>
    <div class="card kpi"><div class="lbl">Budget unspent / overspent</div><div class="val num"><span class="good">${f0(o.unspent)}</span> / <span class="bad">${f0(o.over)}</span></div><div class="sub">end balance ${f2(o.end)}</div></div></div>`;
  h+=`<div class="scroll" style="margin-top:14px"><table class="num"><thead><tr><th>Type</th><th>Budget</th><th>Actual</th><th>Deviation</th></tr></thead><tbody>`;
  for(const c of cats){
    let tb=0,ta=0,rows='';
    for(const t of c.types){
      const bv=bud[t]!==undefined?+bud[t]:null, av=o.types[t]||0;
      const dv=c.kind==='in'?av-(bv||0):(bv||0)-av; tb+=bv||0; ta+=av;
      const show=bv||av;
      rows+=`<tr><td class="sub">${esc(t)}</td><td><input class="bud" inputmode="decimal" value="${bv===null?'':bv}" data-t="${esc(t)}" onchange="setBudget(this.dataset.t,this.value)" aria-label="Budget ${esc(t)}"></td><td>${av?f2(av):'<span class="muted">–</span>'}</td><td class="dev ${show?(dv>=0?'pos':'neg'):''}">${show?(dv>=0?'+':'−')+f2(Math.abs(dv)):'<span class="muted">–</span>'}</td></tr>`;
    }
    const dvt=c.kind==='in'?ta-tb:tb-ta;
    h+=`<tr class="cat"><td>${esc(c.l)}</td><td>${f2(tb)}</td><td>${f2(ta)}</td><td class="dev ${dvt>=0?'pos':'neg'}">${dvt>=0?'+':'−'}${f2(Math.abs(dvt))}</td></tr>${rows}`;
  }
  // uncategorized types
  const TM=typeMap(); const unk=Object.keys(o.types).filter(t=>!TM[t]);
  if(unk.length) h+=`<tr class="cat"><td>Uncategorized</td><td></td><td></td><td></td></tr>`+unk.map(t=>`<tr><td class="sub">${esc(t)}</td><td></td><td>${f2(o.types[t])}</td><td></td></tr>`).join('');
  h+=`</tbody></table></div><p class="hint">Deviation: green = under budget (expenses) / above budget (income). Budgets are per book (${b}) and per month.</p>`;
  v.innerHTML=h;
}
function stepMonth(d){ let m=UI.month+d, y=UI.year; if(m<1){m=12;y--;} if(m>12){m=1;y++;} UI.month=m; UI.year=y; saveUI(); render(); }
function setBudget(t,val){
  const B=JSON.parse(JSON.stringify(cfg('budgets'))); const b=UI.book, k=ymKey(UI.year,UI.month);
  B[b]=B[b]||{}; B[b][k]=B[b][k]||{};
  const n=parseAmt(val); if(val===''||!isFinite(n)) delete B[b][k][t]; else B[b][k][t]=r2(n);
  setSec('budgets',B); render();
}
function copyBudgets(mode){
  const B=JSON.parse(JSON.stringify(cfg('budgets'))); const b=UI.book, y=UI.year, m=UI.month; B[b]=B[b]||{};
  if(mode===-1){ let pm=m-1, py=y; if(pm<1){pm=12;py--;} const src=B[b][ymKey(py,pm)]; if(!src) return toast('Previous month has no budgets');
    if(Object.keys(B[b][ymKey(y,m)]||{}).length&&!confirm('Replace this month\'s budgets?')) return; B[b][ymKey(y,m)]={...src}; }
  else { const src=B[b][ymKey(y,m)]; if(!src) return toast('This month has no budgets'); if(!confirm(`Copy ${MN[m-1]} budgets to ${MN[m]||'-'}–Dec ${y}?`)) return; for(let k=m+1;k<=12;k++) B[b][ymKey(y,k)]={...src}; }
  setSec('budgets',B); toast('Budgets copied'); render();
}

/* ---------------- YEAR ---------------- */
function vYear(v){
  const y=UI.year, b=UI.book, A=agg(y,b), M=A.M, cur=A.cur||12;
  const cats=catsIncomeFirst(), TM=typeMap(), yrs=allYears();
  const isFut=m=>y===THIS_YEAR&&m>THIS_MONTH;
  const cell=(m,val,fmt)=>`<td class="${isFut(m)?'fut':''}">${(fmt||fz)(val)}</td>`;
  const months=[...Array(12)].map((_,i)=>i+1);
  const elapsed=y<THIS_YEAR?12:(y===THIS_YEAR?THIS_MONTH:0);
  const rowSum=(fn)=>{let s=0;for(const m of months) s+=fn(m)||0;return s;};
  let h=`<div class="row" style="margin-bottom:12px">${bookSeg()}
    <select onchange="UI.year=+this.value;saveUI();loadYear(+this.value);render()">${yrs.map(yy=>`<option ${yy===y?'selected':''}>${yy}</option>`).join('')}</select>
    <label class="t2">Starting balance ${y} (${b}) <input type="text" inputmode="decimal" style="width:110px;text-align:right" value="${A.start||''}" onchange="setStart(this.value)"></label></div>`;
  // summary table
  const sumRows=[
    ['Total income',m=>M[m].inc,true],
    ['Total expenses',m=>M[m].exp,true],
    ['Exchanges in − out',m=>M[m].exIn-M[m].exOut,true],
    ['NET',m=>M[m].net,true,'key'],
    ['End balance',m=>M[m].end,false,'key'],
    ['Projected',m=>M[m].proj,false],
  ];
  h+=`<div class="scroll"><table class="num"><thead><tr><th>${y} · ${b}</th>${MN.map((n,i)=>`<th ${i+1===THIS_MONTH&&y===THIS_YEAR?'style="color:var(--accent-2)"':''}>${n}</th>`).join('')}<th>Total</th><th>Avg</th></tr></thead><tbody>`;
  for(const [l,fn,tot,cls] of sumRows){
    const s=rowSum(fn);
    h+=`<tr class="${cls||''}"><td>${l}</td>${months.map(m=>{const x=fn(m);return x===null?'<td class="muted">·</td>':cell(m,x)}).join('')}<td>${tot?f0(s):''}</td><td>${tot&&elapsed?f0(s/elapsed):''}</td></tr>`;
  }
  // net savings (manual)
  h+=`<tr><td>Net savings <span class="hint">(manual)</span></td>${months.map(m=>`<td><input class="ns" inputmode="decimal" value="${M[m].nsSet?M[m].ns:''}" placeholder="${f0(M[m].ns)}" onchange="setNetSav(${m},this.value)" aria-label="Net savings ${MN[m-1]}"></td>`).join('')}<td></td><td></td></tr>`;
  h+=`<tr class="key"><td>TOTAL BALANCE</td>${months.map(m=>cell(m,M[m].total)).join('')}<td></td><td></td></tr>`;
  h+=`<tr><td>Real income <span class="hint">(excl. ${esc(cfg('pull'))})</span></td>${months.map(m=>cell(m,M[m].realInc)).join('')}<td>${f0(rowSum(m=>M[m].realInc))}</td><td>${elapsed?f0(rowSum(m=>M[m].realInc)/elapsed):''}</td></tr>`;
  h+=`<tr><td>Real spending <span class="hint">(excl. savings)</span></td>${months.map(m=>cell(m,M[m].realSp)).join('')}<td>${f0(rowSum(m=>M[m].realSp))}</td><td>${elapsed?f0(rowSum(m=>M[m].realSp)/elapsed):''}</td></tr>`;
  const rn=m=>M[m].realInc-M[m].realSp, rnS=rowSum(rn);
  h+=`<tr class="key"><td>Real net <span class="hint">(real income − real spending)</span></td>${months.map(m=>isFut(m)?cell(m,0):`<td class="${rn(m)<0?'bad':'good'}">${fz(rn(m))}</td>`).join('')}<td class="${rnS<0?'bad':'good'}">${f0(rnS)}</td><td>${elapsed?f0(rnS/elapsed):''}</td></tr>`;
  h+=`</tbody></table></div><p class="hint">Projected = end balance if each month's remaining budgets get spent and its budgeted income arrives.</p>`;
  // charts
  h+=`<div class="stack">
      <div class="card"><h3>Real net by month, ${y} (${b})</h3><div class="chartbox half"><canvas id="chN" role="img" aria-label="Real net by month: real income minus real spending"></canvas></div></div>
      <div class="card"><h3>End balance & projection (${b})</h3><div class="chartbox half"><canvas id="chY" role="img" aria-label="End balance by month with projection"></canvas></div></div>
      <div class="card"><h3>Spending by category, ${y} (${b})</h3><div class="chartbox"><canvas id="chC" role="img" aria-label="Spending by category"></canvas></div></div></div>`;
  // category detail
  h+=`<div class="sectitle">By type</div><div class="scroll"><table class="num"><thead><tr><th>Type</th>${MN.map(n=>`<th>${n}</th>`).join('')}<th>Total</th><th>Avg</th></tr></thead><tbody>`;
  const catTotals=[]; let maxCell={v:0}, maxTot={v:0};
  for(const c of cats){
    const ct=months.map(m=>c.types.reduce((s,t)=>s+(M[m].types[t]||0),0));
    const cs=ct.reduce((a,b2)=>a+b2,0); if(c.kind!=='in') catTotals.push([c.l,cs]);
    h+=`<tr class="cat"><td>${esc(c.l)}</td>${ct.map((x,i)=>cell(i+1,x)).join('')}<td>${f0(cs)}</td><td>${elapsed?f0(cs/elapsed):''}</td></tr>`;
    for(const t of c.types){
      const vals=months.map(m=>M[m].types[t]||0); const s=vals.reduce((a,b2)=>a+b2,0);
      if(c.kind!=='in'){ vals.forEach((x,i)=>{if(x>maxCell.v) maxCell={v:x,t,m:i+1};}); if(s>maxTot.v) maxTot={v:s,t}; }
      if(!s) continue;
      h+=`<tr><td class="sub">${esc(t)}</td>${vals.map((x,i)=>cell(i+1,x)).join('')}<td>${f0(s)}</td><td>${elapsed?f0(s/elapsed):''}</td></tr>`;
    }
  }
  h+=`</tbody></table></div>`;
  if(maxTot.v) h+=`<p class="hint">Biggest single month: ${esc(maxCell.t)} in ${MN[maxCell.m-1]} (${f2(maxCell.v)}) · biggest type this year: ${esc(maxTot.t)} (${f2(maxTot.v)}, avg ${elapsed?f2(maxTot.v/elapsed):'–'}/month)</p>`;
  v.innerHTML=h;
  const endD=months.map(m=>isFut(m)?null:r2(M[m].end)), projD=months.map(m=>M[m].proj===null?null:r2(M[m].proj));
  const netD=months.map(m=>isFut(m)?null:r2(M[m].realInc-M[m].realSp));
  const pos=css('--accent-2'), neg=css('--bad');
  mkChart('chN',{type:'bar',data:{labels:MN,datasets:[{label:'Real net',data:netD,backgroundColor:netD.map(v=>v<0?neg:pos),borderRadius:4,borderSkipped:false,barPercentage:.7}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{...tip(),callbacks:{
      title:c=>`${MN[c[0].dataIndex]} ${y}`,
      label:c=>{const m=c.dataIndex+1;return [` Real income: ${f2(M[m].realInc)} ${b}`,` Real spending: ${f2(M[m].realSp)} ${b}`,` Real net: ${c.parsed.y<0?'−':'+'}${f2(Math.abs(c.parsed.y))} ${b}`];}}}},
      scales:{x:{grid:{display:false},border:{display:false},ticks:{maxRotation:0,autoSkipPadding:8}},y:{grid:{color:ctx=>ctx.tick.value===0?css('--text-2'):css('--line'),drawTicks:false},border:{display:false},ticks:{maxTicksLimit:4,padding:6,callback:v=>f0(v)}}}}});
  mkChart('chY',{type:'line',data:{labels:MN,datasets:[
    {label:'End balance',data:endD,borderColor:css('--accent-2'),backgroundColor:css('--accent-2'),borderWidth:2,pointRadius:4,pointHoverRadius:6,tension:0},
    {label:'Projected',data:projD,borderColor:css('--muted'),backgroundColor:css('--muted'),borderDash:[5,4],borderWidth:2,pointRadius:3,tension:0}]},
    options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{usePointStyle:true}},tooltip:{...tip(),callbacks:{label:c=>` ${c.dataset.label}: ${f2(c.parsed.y)} ${b}`}}},scales:(()=>{const x=axes();x.y.ticks.maxTicksLimit=4;x.x.ticks.maxRotation=0;x.x.ticks.autoSkipPadding=8;return x;})()}});
  const ct=catTotals.filter(x=>x[1]>0).sort((a,b2)=>b2[1]-a[1]);
  mkChart('chC',{type:'bar',data:{labels:ct.map(x=>x[0]),datasets:[{label:'Spent',data:ct.map(x=>r2(x[1])),backgroundColor:css(b==='EUR'?'--s-eur':'--s-chf'),borderRadius:4,borderSkipped:'start',barPercentage:.75}]},
    options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{...tip(),callbacks:{label:c=>` ${f2(c.parsed.x)} ${b}`}}},
      scales:{x:{grid:{color:css('--line'),drawTicks:false},border:{display:false},ticks:{callback:v=>f0(v)}},y:{grid:{display:false},border:{display:false}}}}});
}
function setStart(val){ const S=JSON.parse(JSON.stringify(cfg('start'))); S[UI.book]=S[UI.book]||{}; const n=parseAmt(val); if(val===''||!isFinite(n)) delete S[UI.book][UI.year]; else S[UI.book][UI.year]=r2(n); setSec('start',S); render(); }
function setNetSav(m,val){ const N=JSON.parse(JSON.stringify(cfg('netSav'))); const b=UI.book; N[b]=N[b]||{}; const k=ymKey(UI.year,m); const n=parseAmt(val); if(val===''||!isFinite(n)) delete N[b][k]; else N[b][k]=r2(n); setSec('netSav',N); render(); }

    <p class="hint">Copy columns A–E (Description, Category, Type, CashFlow, Date) from Daily and paste below. Rows already in the app (same date, type, amount, description) are skipped.</p>
    <div class="row"><span class="t2">Currency of these rows</span><div class="seg">${BOOKS.map(b=>`<button class="${(UI.pasteCy||'EUR')===b?'on':''}" onclick="UI.pasteCy='${b}';saveUI();render()">${b}</button>`).join('')}</div></div>
    <textarea id="pastebox" class="w100" rows="5" style="margin-top:8px;background:var(--input);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px ui-monospace,monospace"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn pri" onclick="importPaste()">Import pasted rows</button><span class="hint" id="pasteinfo"></span></div></div>`;
  // categories editor
  const cats=cfg('cats');
  h+=`<div class="card" style="margin-top:12px"><h2>Categories & types</h2>
    <p class="hint">Rename a type and all its past entries and budgets follow. Renaming to an existing type merges the two. "Savings" types count as money moved out of the book into savings; the income type <select onchange="setSec('pull',this.value)">${cats.filter(c=>c.kind==='in').flatMap(c=>c.types).map(t=>`<option ${t===cfg('pull')?'selected':''}>${esc(t)}</option>`).join('')}</select> is treated as money pulled back from savings (excluded from real income).</p>
    ${cats.map((c,ci)=>`<details ${ci===0?'':''}><summary>${esc(c.l)} <span class="hint">(${c.kind==='in'?'income':c.kind==='save'?'savings':'expense'} · ${c.types.length})</span></summary><div style="padding:6px 0 12px 14px">
      <div class="typerow"><span class="hint" style="width:90px">Label</span><input type="text" value="${esc(c.l)}" data-ci="${ci}" onchange="renameCat(+this.dataset.ci,this.value)"></div>
      ${c.types.map(t=>`<div class="typerow"><input type="text" value="${esc(t)}" data-old="${esc(t)}" onchange="renameType(this.dataset.old,this.value)"><button class="btn sm dan" data-t="${esc(t)}" onclick="removeType(this.dataset.t)" aria-label="Remove">✕</button></div>`).join('')}
      <div class="typerow"><input type="text" placeholder="+ new type" data-ci="${ci}" onchange="addType(+this.dataset.ci,this.value)"></div></div></details>`).join('')}
    <div class="row" style="margin-top:10px"><input type="text" id="newcat" placeholder="New expense category"><button class="btn sm" onclick="addCat()">Add category</button></div></div>`;
  h+=`<div class="card" style="margin-top:12px"><h2>Danger zone</h2><button class="btn dan" onclick="wipeLocal()">Clear data in this browser</button> <span class="hint">Your Google Sheet is not touched.</span></div>`;
  v.innerHTML=h;
}
function setTheme(k){ UI.theme=k; saveUI(); if(k==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',k); render(); }
function saveSync(){ localStorage.setItem(LS_SYNC,JSON.stringify(SY)); }
async function connectCloud(){
  const url=document.getElementById('s_url').value.trim(), tok=document.getElementById('s_tok').value.trim();
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) return toast('Paste the Web app URL from Apps Script (…/exec)');
  if(!tok) return toast('Enter the password');
  const changed=url!==SY.url;
  SY.url=url; SY.token=tok; saveSync();
  if(changed||!D.lastSync){ // first connect (or a different Sheet): send everything this browser has, get everything the Sheet has
    D.lastSync=0;
    for(const y in D.tx) for(const id in D.tx[y]) markTx(id,y);
    for(const k in D.sec) if(D.sec[k].u) D.dirty.sec[k]=1;
    saveLocal();
  }
  syncState='ok'; setPill('pend','connecting…');
  await syncNow({manual:true,render:true});
  if(syncState==='ok') toast('Connected to your Google Sheet');
  render();
}
function disconnect(){ if(!confirm('Stop syncing on this device? Data in this browser and in the Sheet stays.')) return; SY.url=''; saveSync(); render(); }
function wipeLocal(){ if(!confirm('Delete all Cashflow data stored in this browser? (The Google Sheet keeps its copy.)')) return; localStorage.removeItem(LS_DATA); D=emptyData(); render(); }
function download(name,text,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function exportJSON(){
  const out={app:APP,v:VER,exported:new Date().toISOString().slice(0,10),config:{},tx:{}};
  for(const k in D.sec) out.config[k]=D.sec[k].v;
  for(const y in D.tx) out.tx[y]=Object.values(D.tx[y]).filter(t=>!t.del).map(txToArr);
  download(`cashflow_backup_${out.exported}.json`,JSON.stringify(out),'application/json');
}
function exportCSV(){
  const TM=typeMap(); const rows=[['date','description','category','type','amount','currency','received','received_currency']];
  for(const t of allTxSorted().reverse()){ const tt=resolveType(t.t); rows.push([`${t.y}-${t.md}`,t.ds,t.t===FX?'EXCHANGE':(TM[tt]?TM[tt].k:''),t.t===FX?'':tt,t.a,t.cy,t.a2??'',t.cy2??'']); }
  download('cashflow_transactions.csv',rows.map(r=>r.map(x=>{x=String(x??'');return /[",\n;]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}).join(',')).join('\n'),'text/csv');
}
async function importJSON(file){
  if(!file) return; let j; try{ j=JSON.parse(await file.text()); }catch(e){ return toast('Not a valid JSON file'); }
  if(j.app!==APP) return toast('Not a Cashflow file');
  const hasLocal=Object.values(D.tx).some(o=>Object.keys(o).length);
  const n=Object.values(j.tx||{}).reduce((s,a)=>s+a.length,0);
  if(!confirm(`Import ${n} entries${j.config?' + settings (categories, budgets, net savings, starting balances)':''}?${hasLocal?'\nEntries merge with what is here (same IDs are updated). Settings in the file replace current ones.':''}`)) return;
  const u=nowS();
  for(const k in (j.config||{})) if(D.sec[k]!==undefined||k) D.sec[k]={u,v:j.config[k]};
  for(const k in (j.config||{})) D.dirty.sec[k]=1;
  for(const y in (j.tx||{})){ for(const a of j.tx[y]){ const t=arrToTx(a,y); if(t.del) continue; t.u=u; placeTx(t); markTx(t.id,t.y); } }
  saveLocal(); scheduleSync(3000); toast(`Imported ${n} entries`); render();
}
function importPaste(){
  const txt=document.getElementById('pastebox').value; const cy=UI.pasteCy||'EUR'; const TM=typeMap();
  const have=new Set(allTxSorted().map(t=>`${t.y}-${t.md}|${resolveType(t.t)}|${r2(t.a)}|${(t.ds||'').trim().toLowerCase()}`));
  let add=0,skip=0,bad=0;
  for(const line of txt.split(/\r?\n/)){
    if(!line.trim()) continue; const c=line.split('\t'); if(c.length<5){bad++;continue;}
    const ds=c[0].trim(), type=resolveType(c[2].trim()), a=parseAmt(c[3]);
    const dm=c[4].trim().match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/)||null, im=c[4].trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
    let date=null; if(dm) date=`${dm[3]}-${pad(dm[2])}-${pad(dm[1])}`; else if(im) date=`${im[1]}-${im[2]}-${im[3]}`;
    if(!date||!isFinite(a)||!type||c[0]==='Description'){bad++;continue;}
    if(!TM[type]){bad++;continue;}
    const key=`${date}|${type}|${r2(a)}|${ds.toLowerCase()}`; if(have.has(key)){skip++;continue;}
    have.add(key); const y=+date.slice(0,4); D.tx[y]=D.tx[y]||{}; const id=rid();
    D.tx[y][id]={id,y,md:date.slice(5),ds,t:type,a:r2(a),cy,u:nowS()}; markTx(id,y); add++;
  }
  saveLocal(); scheduleSync(3000);
  document.getElementById('pasteinfo').textContent=`${add} added · ${skip} already there · ${bad} not understood`;
  toast(`${add} rows imported`);
}
function mutateCats(fn){ const C=JSON.parse(JSON.stringify(cfg('cats'))); fn(C); setSec('cats',C); }
function renameCat(ci,l){ l=l.trim(); if(!l) return render(); mutateCats(C=>{C[ci].l=l;}); render(); }
function addType(ci,t){ t=t.trim(); if(!t) return; if(typeMap()[t]) {toast('Type already exists');return render();} mutateCats(C=>C[ci].types.push(t)); render(); }
function addCat(){ const l=document.getElementById('newcat').value.trim(); if(!l) return; mutateCats(C=>{ const k=l.toUpperCase().replace(/[^A-Z0-9]+/g,'_'); const i=C.findIndex(c=>c.k==='OTHER'); C.splice(i<0?C.length:i,0,{k,l,kind:'out',types:[]}); }); render(); }
function renameType(oldT,newT){
  newT=newT.trim(); if(!newT||newT===oldT) return render();
  const exists=!!typeMap()[newT];
  if(exists&&!confirm(`"${newT}" already exists. Merge all "${oldT}" entries and budgets into it?`)) return render();
  mutateCats(C=>{ for(const c of C){ const i=c.types.indexOf(oldT); if(i>-1){ if(exists) c.types.splice(i,1); else c.types[i]=newT; } } });
  const Al={...cfg('aliases'),[oldT]:newT}; delete Al[newT]; setSec('aliases',Al);
  const u=nowS(); for(const y in D.tx) for(const t of Object.values(D.tx[y])) if(!t.del&&t.t===oldT){ t.t=newT; t.u=u; markTx(t.id,y); } saveLocal();
  const B=JSON.parse(JSON.stringify(cfg('budgets'))); for(const b in B) for(const k in B[b]) if(B[b][k][oldT]!==undefined){ B[b][k][newT]=r2((+B[b][k][newT]||0)+(+B[b][k][oldT])); delete B[b][k][oldT]; } setSec('budgets',B);
  if(cfg('pull')===oldT) setSec('pull',newT);
  toast(exists?'Merged':'Renamed'); render();
}
function removeType(t){
  const used=allTxSorted(x=>resolveType(x.t)===t).length;
  if(used){ const to=prompt(`"${t}" has ${used} entries. Type the name of the type to move them to (it must exist):`); if(!to) return; if(!typeMap()[to.trim()]) return toast('That type does not exist'); return renameType(t,to.trim()); }
  if(!confirm(`Remove type "${t}"?`)) return;
  mutateCats(C=>{ for(const c of C){ const i=c.types.indexOf(t); if(i>-1) c.types.splice(i,1);} }); render();
}

/* ---------------- boot ---------------- */
render();
fetchRate(false);
if(cloudOn()) syncNow();
</script>
